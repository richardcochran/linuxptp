#
[global]
domainNumber			0
priority1			128
priority2			128
clientOnly			0
serverOnly			0
twoStepFlag			1
logAnnounceInterval		1
announceReceiptTimeout		3
logSyncInterval			0
logMinDelayReqInterval		0
logMinPdelayReqInterval		0
delay_mechanism			E2E
transportSpecific		0
profileIdentity			00:1B:19:03:01:00
externalPortConfigurationEnabled	0
L1SyncEnabled			1
txCoherentIsRequired		1
rxCoherentIsRequired		1
congruentIsRequired		1
optParamsEnabled		0
logL1SyncInterval		0
L1SyncReceiptTimeout		3
asymmetryCorrectionPortDS.enable		1
asymmetryCorrectionPortDS.constantAsymmetry	0
asymmetryCorrectionPortDS.delayCoefficient	0.0
